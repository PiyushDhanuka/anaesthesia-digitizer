<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand A - Patient Monitor Simulator</title>
  <style>
    /* ==========================================================================
       STYLE DEFINITIONS - BRAND A (Philips / GE Style Medical Monitor)
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Consolas', 'Courier New', 'Lucida Console', monospace;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Monitor Header Bar */
    .header-bar {
      height: 48px;
      background: #111116;
      border-bottom: 2px solid #22222d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 14px;
      color: #a0a0a0;
    }

    .brand-title {
      font-weight: bold;
      color: #e0e0e0;
      letter-spacing: 1.5px;
    }

    .patient-info span {
      margin-right: 20px;
    }

    .patient-info strong {
      color: #ffffff;
    }

    .status-badge {
      padding: 4px 12px;
      border-radius: 4px;
      background: #163316;
      color: #00ff66;
      font-weight: bold;
      font-size: 12px;
      letter-spacing: 1px;
      transition: background 0.3s, color 0.3s;
    }

    .status-badge.alert {
      background: #551111;
      color: #ff3333;
      animation: flash-badge 0.8s infinite alternate;
    }

    @keyframes flash-badge {
      from { opacity: 1; }
      to { opacity: 0.4; }
    }

    /* 2x2 Main Grid Layout for Readouts */
    .monitor-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 14px;
      padding: 14px;
    }

    /* Parameter Card Panels */
    .readout-card {
      background: #08080c;
      border: 2px solid #1a1a26;
      border-radius: 6px;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .readout-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 2;
    }

    .param-label {
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .param-unit {
      font-size: 16px;
      font-weight: normal;
      margin-left: 6px;
      opacity: 0.85;
    }

    .param-limits {
      font-size: 13px;
      opacity: 0.55;
      text-align: right;
      line-height: 1.3;
    }

    .value-container {
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      flex: 1;
      margin-top: 10px;
      z-index: 2;
    }

    .main-value {
      font-size: 110px;
      font-weight: bold;
      line-height: 1;
      letter-spacing: -2px;
      transition: color 0.3s;
    }

    .sub-value {
      font-size: 42px;
      font-weight: bold;
      margin-left: 12px;
      opacity: 0.85;
    }

    /* Canvas Background for Animated Waveforms */
    .waveform-canvas {
      position: absolute;
      left: 20px;
      bottom: 20px;
      width: calc(55% - 20px);
      height: 70px;
      opacity: 0.75;
      pointer-events: none;
      z-index: 1;
    }

    /* --------------------------------------------------------------------------
       PARAMETER COLOR SCHEMES
       -------------------------------------------------------------------------- */
    /* 1. Heart Rate (HR) - Green */
    .card-hr {
      border-color: #003a14;
    }
    .card-hr .param-label, .card-hr .main-value, .card-hr .param-unit {
      color: #00ff44;
      text-shadow: 0 0 14px rgba(0, 255, 68, 0.35);
    }

    /* 2. SpO2 - Cyan / Light Blue */
    .card-spo2 {
      border-color: #003a4d;
    }
    .card-spo2 .param-label, .card-spo2 .main-value, .card-spo2 .param-unit {
      color: #00e5ff;
      text-shadow: 0 0 14px rgba(0, 229, 255, 0.35);
    }

    /* 3. NIBP (Blood Pressure) - Red Label & White Numerics */
    .card-nibp {
      border-color: #4a1515;
    }
    .card-nibp .param-label, .card-nibp .param-unit {
      color: #ff3344;
    }
    .card-nibp .main-value {
      color: #ffffff;
      font-size: 86px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
    }
    .card-nibp .sub-value {
      color: #ff8888;
    }

    /* 4. EtCO2 - Yellow */
    .card-etco2 {
      border-color: #4d3e00;
    }
    .card-etco2 .param-label, .card-etco2 .main-value, .card-etco2 .param-unit {
      color: #ffea00;
      text-shadow: 0 0 14px rgba(255, 234, 0, 0.35);
    }

    /* Alarm State Flashing Animation for Abnormal Cycles */
    .alarm-active {
      animation: border-alarm 1s infinite alternate;
    }
    @keyframes border-alarm {
      from { border-color: #ff0000; box-shadow: inset 0 0 25px rgba(255, 0, 0, 0.45); }
      to { border-color: #550000; box-shadow: inset 0 0 5px rgba(255, 0, 0, 0.15); }
    }

    /* Subtle Trigger Button for Critical Event (non-medical UI) */
    .subtle-event-btn {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 10;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 5px 12px;
      font-size: 11px;
      font-family: system-ui, -apple-system, sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-left: 0;
    }
    .subtle-event-btn:hover:not(:disabled) {
      background: #334155;
      color: #f8fafc;
      border-color: #475569;
    }
    .subtle-event-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      background: #0f172a;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- Header / Status Bar -->
  <header class="header-bar">
    <div class="brand-title">BRAND-A // ANESTHESIA MONITOR</div>
    <div class="patient-info">
      <span>PATIENT: <strong>DOE, J. (ADULT)</strong></span>
      <span>BED: <strong>04</strong></span>
      <span id="clock-display">00:00:00</span>
    </div>
    <div style="display: flex; align-items: center;">
      <div id="status-badge" class="status-badge">MONITORING</div>
    </div>
  </header>

  <!-- 2x2 Monitor Grid with Corner ArUco Anchor Markers -->
  <main class="monitor-grid" style="position: relative;">
    <!-- ArUco Marker ID 0 (Top-Left Anchor) -->
    <svg width="42" height="42" viewBox="0 0 6 6" style="position: absolute; top: 18px; left: 18px; z-index: 100; background: #ffffff; padding: 3px; border-radius: 3px; box-shadow: 0 0 6px rgba(0,0,0,0.8);"><rect width="6" height="6" fill="#000000"/><rect x="1" y="1" width="1" height="1" fill="#ffffff"/><rect x="3" y="1" width="1" height="1" fill="#ffffff"/><rect x="4" y="2" width="1" height="1" fill="#ffffff"/><rect x="1" y="3" width="1" height="1" fill="#ffffff"/><rect x="2" y="3" width="1" height="1" fill="#ffffff"/><rect x="4" y="3" width="1" height="1" fill="#ffffff"/><rect x="1" y="4" width="1" height="1" fill="#ffffff"/><rect x="3" y="4" width="1" height="1" fill="#ffffff"/></svg>
    
    <!-- ArUco Marker ID 1 (Top-Right Anchor) -->
    <svg width="42" height="42" viewBox="0 0 6 6" style="position: absolute; top: 18px; right: 18px; z-index: 100; background: #ffffff; padding: 3px; border-radius: 3px; box-shadow: 0 0 6px rgba(0,0,0,0.8);"><rect width="6" height="6" fill="#000000"/><rect x="1" y="1" width="1" height="1" fill="#ffffff"/><rect x="3" y="1" width="1" height="1" fill="#ffffff"/><rect x="4" y="1" width="1" height="1" fill="#ffffff"/><rect x="2" y="2" width="1" height="1" fill="#ffffff"/><rect x="4" y="2" width="1" height="1" fill="#ffffff"/><rect x="1" y="3" width="1" height="1" fill="#ffffff"/><rect x="2" y="3" width="1" height="1" fill="#ffffff"/><rect x="3" y="3" width="1" height="1" fill="#ffffff"/><rect x="2" y="4" width="1" height="1" fill="#ffffff"/><rect x="3" y="4" width="1" height="1" fill="#ffffff"/></svg>

    <!-- ArUco Marker ID 2 (Bottom-Left Anchor) -->
    <svg width="42" height="42" viewBox="0 0 6 6" style="position: absolute; bottom: 18px; left: 18px; z-index: 100; background: #ffffff; padding: 3px; border-radius: 3px; box-shadow: 0 0 6px rgba(0,0,0,0.8);"><rect width="6" height="6" fill="#000000"/><rect x="1" y="1" width="1" height="1" fill="#ffffff"/><rect x="2" y="2" width="1" height="1" fill="#ffffff"/><rect x="3" y="2" width="1" height="1" fill="#ffffff"/><rect x="4" y="2" width="1" height="1" fill="#ffffff"/><rect x="1" y="3" width="1" height="1" fill="#ffffff"/><rect x="3" y="3" width="1" height="1" fill="#ffffff"/><rect x="2" y="4" width="1" height="1" fill="#ffffff"/><rect x="4" y="4" width="1" height="1" fill="#ffffff"/></svg>

    <!-- ArUco Marker ID 3 (Bottom-Right Anchor) -->
    <svg width="42" height="42" viewBox="0 0 6 6" style="position: absolute; bottom: 18px; right: 18px; z-index: 100; background: #ffffff; padding: 3px; border-radius: 3px; box-shadow: 0 0 6px rgba(0,0,0,0.8);"><rect width="6" height="6" fill="#000000"/><rect x="2" y="1" width="1" height="1" fill="#ffffff"/><rect x="3" y="1" width="1" height="1" fill="#ffffff"/><rect x="4" y="1" width="1" height="1" fill="#ffffff"/><rect x="1" y="2" width="1" height="1" fill="#ffffff"/><rect x="3" y="2" width="1" height="1" fill="#ffffff"/><rect x="4" y="2" width="1" height="1" fill="#ffffff"/><rect x="1" y="3" width="1" height="1" fill="#ffffff"/><rect x="2" y="4" width="1" height="1" fill="#ffffff"/><rect x="4" y="4" width="1" height="1" fill="#ffffff"/></svg>

    <!-- 1. Heart Rate (HR) -->
    <section class="readout-card card-hr" id="card-hr">
      <div class="readout-header">
        <div>
          <span class="param-label">HR</span>
          <span class="param-unit">bpm</span>
        </div>
        <div class="param-limits">
          HIGH 120<br>LOW 50
        </div>
      </div>
      <canvas id="canvas-hr" class="waveform-canvas"></canvas>
      <div class="value-container">
        <span id="val-hr" class="main-value">72</span>
      </div>
    </section>

    <!-- 2. SpO2 (Oxygen Saturation) -->
    <section class="readout-card card-spo2" id="card-spo2">
      <div class="readout-header">
        <div>
          <span class="param-label">SpO2</span>
          <span class="param-unit">%</span>
        </div>
        <div class="param-limits">
          HIGH 100<br>LOW 90
        </div>
      </div>
      <canvas id="canvas-spo2" class="waveform-canvas"></canvas>
      <div class="value-container">
        <span id="val-spo2" class="main-value">98</span>
      </div>
    </section>

    <!-- 3. Blood Pressure (NIBP) -->
    <section class="readout-card card-nibp" id="card-nibp">
      <div class="readout-header">
        <div>
          <span class="param-label">NIBP</span>
          <span class="param-unit">mmHg</span>
        </div>
        <div class="param-limits">
          SYS 160 / 90<br>DIA 100 / 50
        </div>
      </div>
      <div class="value-container">
        <span id="val-nibp" class="main-value">120/80</span>
        <span id="val-map" class="sub-value">(93)</span>
      </div>
    </section>

    <!-- 4. EtCO2 -->
    <section class="readout-card card-etco2" id="card-etco2">
      <div class="readout-header">
        <div>
          <span class="param-label">EtCO2</span>
          <span class="param-unit">mmHg</span>
        </div>
        <div class="param-limits">
          HIGH 50<br>LOW 30
        </div>
      </div>
      <canvas id="canvas-etco2" class="waveform-canvas"></canvas>
      <div class="value-container">
        <span id="val-etco2" class="main-value">38</span>
      </div>
    </section>

  </main>

  <!-- Simulator control: intentionally outside the monitor interface. -->
  <button id="btn-trigger-event" class="subtle-event-btn" title="Trigger 45-Second Desaturation Event Sequence">Trigger Critical Event</button>

  <!-- Simulation Control Script -->
  <script>
    /* ==========================================================================
       SIMULATION CONFIGURATION & RANGES
       Adjust these parameters to customize realistic monitor behaviour.
       ========================================================================== */
    const CONFIG = {
      // Normal physiological ranges for simulation
      hr: { min: 65, max: 85 },        // Heart Rate (bpm)
      spo2: { min: 96, max: 99 },      // Oxygen Saturation (%)
      sys: { min: 110, max: 130 },     // Systolic Blood Pressure (mmHg)
      dia: { min: 70, max: 85 },       // Diastolic Blood Pressure (mmHg)
      etco2: { min: 35, max: 42 },     // End-Tidal CO2 (mmHg)

      // Timing & anomaly settings
      updateIntervalMs: 3000,          // Refresh rate: every 3 seconds
      anomalyIntervalCycles: 10,      // Every ~10 cycles (approx 30 seconds), trigger anomaly
      abnormalSpo2Value: 88,          // Brief abnormal SpO2 dip reading
    };

    // Tracking current simulation cycle
    let cycleCount = 0;

    // DOM Reference Handles
    const elHr = document.getElementById('val-hr');
    const elSpo2 = document.getElementById('val-spo2');
    const elNibp = document.getElementById('val-nibp');
    const elMap = document.getElementById('val-map');
    const elEtco2 = document.getElementById('val-etco2');
    const elCardSpo2 = document.getElementById('card-spo2');
    const elStatusBadge = document.getElementById('status-badge');
    const elClock = document.getElementById('clock-display');
    const btnTriggerEvent = document.getElementById('btn-trigger-event');

    // Critical Event State
    let isCriticalEventActive = false;
    let criticalEventStartTime = null;
    let eventStartSpo2 = 98;
    let eventStartHr = 72;

    function triggerCriticalEvent() {
      if (isCriticalEventActive) return;
      isCriticalEventActive = true;
      criticalEventStartTime = Date.now();

      // Store current baseline readings
      eventStartHr = parseInt(elHr.textContent) || 72;
      eventStartSpo2 = parseInt(elSpo2.textContent) || 98;

      if (btnTriggerEvent) {
        btnTriggerEvent.disabled = true;
        btnTriggerEvent.textContent = 'Event in progress...';
      }

      updateMonitorReadings();
    }

    if (btnTriggerEvent) {
      btnTriggerEvent.addEventListener('click', triggerCriticalEvent);
    }

    /**
     * Helper: Generate a random integer in inclusive range [min, max]
     */
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    /**
     * Main Simulation Loop - Called every 3 seconds
     */
    function updateMonitorReadings() {
      cycleCount++;

      let currentHr;
      let currentSpo2;

      if (isCriticalEventActive) {
        const elapsedMs = Date.now() - criticalEventStartTime;

        if (elapsedMs <= 15000) {
          // Phase 1 (0-15s): SpO2 gradually declines to 84-86%, HR gradually rises to 125-135 bpm
          const t = Math.min(1, elapsedMs / 15000);
          const targetSpo2 = 85;
          const targetHr = 130;

          currentSpo2 = Math.round(eventStartSpo2 + (targetSpo2 - eventStartSpo2) * t) + getRandomInt(-1, 1);
          currentHr = Math.round(eventStartHr + (targetHr - eventStartHr) * t) + getRandomInt(-2, 2);
        } else if (elapsedMs <= 30000) {
          // Phase 2 (15-30s): Hold SpO2 around 84-86% and HR around 125-135 bpm (critical plateau)
          currentSpo2 = getRandomInt(84, 86);
          currentHr = getRandomInt(125, 135);
        } else if (elapsedMs <= 45000) {
          // Phase 3 (30-45s): Gradually recover — SpO2 climbing back to 96-99%, HR coming back down to 65-85 bpm
          const t = Math.min(1, (elapsedMs - 30000) / 15000);
          const startRecSpo2 = 85;
          const endRecSpo2 = 98;
          const startRecHr = 130;
          const endRecHr = 72;

          currentSpo2 = Math.round(startRecSpo2 + (endRecSpo2 - startRecSpo2) * t) + getRandomInt(-1, 1);
          currentHr = Math.round(startRecHr + (endRecHr - startRecHr) * t) + getRandomInt(-2, 2);
        } else {
          // Phase 4 (After 45s): Event finished -> Reset state & button, resume normal random fluctuation
          isCriticalEventActive = false;
          if (btnTriggerEvent) {
            btnTriggerEvent.disabled = false;
            btnTriggerEvent.textContent = 'Trigger Critical Event';
          }
          currentHr = getRandomInt(CONFIG.hr.min, CONFIG.hr.max);
          currentSpo2 = getRandomInt(CONFIG.spo2.min, CONFIG.spo2.max);
        }
      } else {
        // Normal simulation fluctuation
        const isAnomalyCycle = (cycleCount % CONFIG.anomalyIntervalCycles === 0);
        currentHr = getRandomInt(CONFIG.hr.min, CONFIG.hr.max);
        if (isAnomalyCycle) {
          currentSpo2 = CONFIG.abnormalSpo2Value;
        } else {
          currentSpo2 = getRandomInt(CONFIG.spo2.min, CONFIG.spo2.max);
        }
      }

      // Clamp display values within safe physiological bounds
      currentSpo2 = Math.max(70, Math.min(100, currentSpo2));
      currentHr = Math.max(40, Math.min(220, currentHr));

      elHr.textContent = currentHr;
      elSpo2.textContent = currentSpo2;

      // Alarm state handling
      if (currentSpo2 < 90) {
        elCardSpo2.classList.add('alarm-active');
        elStatusBadge.textContent = 'ALARM: SPO2 LOW';
        elStatusBadge.classList.add('alert');
      } else {
        elCardSpo2.classList.remove('alarm-active');
        elStatusBadge.textContent = 'MONITORING';
        elStatusBadge.classList.remove('alert');
      }

      // 3. NIBP (Blood Pressure) - Red/White
      const currentSys = getRandomInt(CONFIG.sys.min, CONFIG.sys.max);
      const currentDia = getRandomInt(CONFIG.dia.min, CONFIG.dia.max);
      const currentMap = Math.round(currentDia + (currentSys - currentDia) / 3);

      elNibp.textContent = `${currentSys}/${currentDia}`;
      elMap.textContent = `(${currentMap})`;

      // 4. EtCO2 - Yellow
      const currentEtco2 = getRandomInt(CONFIG.etco2.min, CONFIG.etco2.max);
      elEtco2.textContent = currentEtco2;

      // Debug side-channel fetch logging for automated OCR accuracy verification
      sendDebugGroundTruth('heart_rate', currentHr);
      sendDebugGroundTruth('spo2', currentSpo2);
      sendDebugGroundTruth('bp_systolic', currentSys);
      sendDebugGroundTruth('bp_diastolic', currentDia);
      sendDebugGroundTruth('etco2', currentEtco2);
    }

    /**
     * Helper: Send ground-truth values to backend debug logging endpoint.
     * Wrapped in try/catch to silently ignore failures and never affect simulator display behavior.
     */
    function sendDebugGroundTruth(field, value) {
      try {
        const API_BASE = window.location.origin;
        fetch(`${API_BASE}/debug/ground-truth`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            field: field,
            value: value,
            timestamp: new Date().toISOString()
          })
        }).catch(() => {});
      } catch (err) {
        // Silently ignore debug logging failures
      }
    }

    /**
     * Real-time Clock Handler
     */
    function updateClock() {
      const now = new Date();
      elClock.textContent = now.toTimeString().split(' ')[0];
    }
    setInterval(updateClock, 1000);
    updateClock();

    /**
     * Canvas Real-time Waveform Rendering (Aesthetic Visual Enhancement)
     */
    function initWaveforms() {
      const setupWaveformCanvas = (id, color, waveFn) => {
        const canvas = document.getElementById(id);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let phase = 0;

        setInterval(() => {
          canvas.width = canvas.clientWidth;
          canvas.height = canvas.clientHeight;
          const w = canvas.width;
          const h = canvas.height;
          
          ctx.clearRect(0, 0, w, h);
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.beginPath();

          phase += 0.08;
          for (let x = 0; x < w; x++) {
            const t = (x * 0.04) + phase;
            const y = waveFn(t, h);
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }, 40);
      };

      // ECG Waveform (HR)
      setupWaveformCanvas('canvas-hr', '#00ff44', (t, h) => {
        const mod = t % (Math.PI * 2);
        if (mod > 2.0 && mod < 2.25) return h * 0.2;  // R Peak
        if (mod >= 2.25 && mod < 2.45) return h * 0.8; // S Dip
        return h * 0.55 + Math.sin(t * 0.8) * 3;
      });

      // Pleth Waveform (SpO2)
      setupWaveformCanvas('canvas-spo2', '#00e5ff', (t, h) => {
        return h * 0.5 + Math.sin(t) * (h * 0.25) + Math.sin(t * 2) * (h * 0.08);
      });

      // Capnogram Waveform (EtCO2)
      setupWaveformCanvas('canvas-etco2', '#ffea00', (t, h) => {
        const mod = t % 6;
        if (mod > 1.2 && mod < 4.2) return h * 0.3; // Expiratory plateau
        return h * 0.8; // Baseline
      });
    }

    // Initialize visual waveforms
    initWaveforms();

    // Start simulation immediately on page load
    updateMonitorReadings();
    setInterval(updateMonitorReadings, CONFIG.updateIntervalMs);
  </script>
</body>
</html>
